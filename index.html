<style>
:root {
  /* One visual world: a grainy palm at night. Fronds are the navigation; a panel opens beside the zoomed frond. */
  --night: #26262b;
  --night-deep: #1a1a1e;
  --ink: #d6d5d0;
  --dim: #8f8e8a;
  --hair: #4a4a50;
  --accent: #e8573f;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--night-deep); color: var(--ink); font-family: var(--body); font-weight: 300; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 1px dashed var(--accent); outline-offset: 4px; }

.frame { position: fixed; inset: 10px; background: var(--night); border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 120px rgba(0,0,0,.55); }
.scene { position: absolute; inset: 0; transition: transform 1.1s cubic-bezier(.65,0,.25,1); will-change: transform; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
svg.lines path { stroke: var(--ink); stroke-width: .8; fill: none; opacity: .75; }

.tag { position: absolute; font-size: 14px; letter-spacing: .01em; white-space: nowrap; padding: 6px 4px; color: var(--ink); transition: color .25s, opacity .5s; }
.tag:hover, .tag[aria-current="true"] { color: var(--accent); }
.tag .sub { display: block; font-size: 10.5px; color: var(--dim); letter-spacing: .06em; text-transform: lowercase; }
.tag.right { text-align: left; } .tag.left { text-align: right; }
body.open .tag:not([aria-current="true"]) { opacity: .25; }

.intro { position: absolute; left: 34px; top: 30px; max-width: 330px; z-index: 2; transition: opacity .5s; }
.intro h1 { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.1; margin: 0 0 6px; }
.intro h1 em { color: var(--accent); }
.intro p { margin: 0; font-size: 13px; color: var(--dim); line-height: 1.55; }
.hint { position: absolute; left: 34px; bottom: 28px; font-size: 12px; color: var(--dim); z-index: 2; transition: opacity .5s; }
.note { position: absolute; right: 34px; bottom: 26px; z-index: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; transition: opacity .5s; }
.note span { font-size: 12px; color: var(--dim); font-style: italic; font-family: var(--display); }
.player { display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--night); border-radius: 999px; padding: 6px 14px 6px 8px; font-size: 13px; font-weight: 500; }
.player button { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--night); }
.player button:hover, .player a:hover { color: var(--accent); }
.player a { color: var(--night); text-decoration: none; font-size: 13px; }
.player .track { white-space: nowrap; }
.eq { display: flex; gap: 2px; align-items: flex-end; height: 11px; width: 12px; }
.eq i { width: 2px; height: 3px; background: currentColor; border-radius: 1px; }
.player.on .eq i { animation: eq .9s ease-in-out infinite alternate; }
.player.on .eq i:nth-child(2) { animation-delay: .25s; } .player.on .eq i:nth-child(3) { animation-delay: .5s; }
@keyframes eq { from { height: 2px; } to { height: 11px; } }
#yt { position: absolute; width: 1px; height: 1px; left: -9999px; top: 0; }
body.open .intro, body.open .hint, body.open .note { opacity: 0; pointer-events: none; }

/* panel */
.panel { position: fixed; top: 10px; right: 10px; bottom: 10px; width: min(600px, calc(100% - 20px)); background: rgba(22,22,26,.94); backdrop-filter: blur(6px); border-left: 1px solid var(--hair); border-radius: 0 6px 6px 0; transform: translateX(105%); transition: transform .8s cubic-bezier(.65,0,.25,1) .15s; overflow-y: auto; z-index: 5; }
body.open .panel { transform: none; }
.panel-inner { padding: 34px 40px 60px; }
.back { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--dim); margin-bottom: 26px; }
.back:hover { color: var(--accent); }
.kicker { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 4vw, 40px); line-height: 1.05; margin: 0 0 8px; text-wrap: balance; }
.panel .what { color: var(--dim); font-size: 13px; margin: 0 0 24px; }
.panel h3 { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); font-weight: 500; margin: 28px 0 10px; padding-top: 14px; border-top: 1px solid var(--hair); }
.panel p { line-height: 1.65; font-size: 14.5px; margin: 0 0 12px; max-width: 62ch; }
.panel .insight { font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.4; color: var(--ink); }
.panel ul { margin: 0; padding: 0 0 0 18px; display: grid; gap: 8px; font-size: 14px; line-height: 1.55; }
.panel li::marker { color: var(--accent); }
.panel img.hero { width: 100%; border-radius: 3px; display: block; margin: 0 0 22px; filter: grayscale(.15) contrast(1.02); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.split > div { background: rgba(255,255,255,.035); padding: 14px 16px; border-radius: 4px; }
.split b { display: block; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 500; margin-bottom: 6px; color: var(--accent); }
.split > div:last-child b { color: var(--dim); }
.split p { font-size: 13px; margin: 0; }
.ar { font-family: var(--body); direction: rtl; unicode-bidi: isolate; }
.tiers { display: grid; gap: 10px; }
.tier { padding: 14px 16px; border: 1px solid var(--hair); border-radius: 4px; }
.tier small { display: block; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
.tier .line { font-family: var(--display); font-size: 22px; }
.tier.core { border-color: var(--accent); }
.tier.core .line .ar { color: var(--accent); margin-right: 10px; }
.touch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.touch div { font-size: 12.5px; color: var(--dim); }
.touch div strong { display: block; font-family: var(--display); font-weight: 400; font-size: 16px; color: var(--ink); margin-bottom: 3px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 6px 0 4px; }
.stats div { border-top: 1px solid var(--hair); padding-top: 10px; font-size: 12.5px; color: var(--dim); line-height: 1.4; }
.stats strong { display: block; font-family: var(--display); font-weight: 400; font-size: 34px; color: var(--accent); line-height: 1; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.steps { counter-reset: s; display: grid; gap: 12px; }
.steps div { display: grid; grid-template-columns: 34px 1fr; gap: 4px 10px; }
.steps div::before { counter-increment: s; content: "0" counter(s); font-family: var(--display); font-style: italic; color: var(--accent); font-size: 18px; grid-row: span 2; }
.steps strong { font-weight: 500; font-size: 14.5px; }
.steps span { font-size: 13.5px; color: var(--dim); line-height: 1.5; }
.roles { display: grid; gap: 0; }
.roles div { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 14px; }
.roles div span { color: var(--dim); font-size: 12.5px; }
.roles div em { font-style: normal; color: var(--accent); font-size: 12px; grid-row: span 2; align-self: center; }
.snap { display: grid; grid-template-columns: 150px 1fr; gap: 18px; padding: 18px 0; border-top: 1px solid var(--hair); }
.snap img { width: 100%; border-radius: 3px; }
.snap h4 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 2px; }
.snap .sec { font-size: 12px; color: var(--dim); margin-bottom: 10px; }
.snap dl { margin: 0; display: grid; gap: 6px; font-size: 13px; line-height: 1.5; }
.snap dt { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.snap dd { margin: 0; }
.quote { padding: 20px 0; border-top: 1px solid var(--hair); }
.quote .ar { display: block; font-size: 26px; font-weight: 500; line-height: 1.5; text-align: right; }
.quote .meta { font-size: 12.5px; color: var(--dim); line-height: 1.6; margin-top: 8px; }
.quote .meta b { color: var(--accent); font-weight: 500; letter-spacing: .12em; text-transform: uppercase; font-size: 10.5px; margin-right: 6px; }
.essays { display: grid; gap: 0; }
.essay { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--hair); color: var(--ink); text-decoration: none; }
.essay .ar { font-size: 17px; font-weight: 500; order: 2; text-align: right; }
.essay small { color: var(--dim); font-size: 11.5px; white-space: nowrap; order: 1; }
.essay:hover .ar { color: var(--accent); }
.essay.feat .ar { font-size: 20px; }
.essay.feat small { color: var(--accent); }
.more-link { color: var(--accent); text-decoration: none; font-size: 14px; border-bottom: 1px solid var(--accent); }
.contact { display: grid; gap: 0; }
.contact div { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--hair); }
.contact small { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); width: 90px; }
.contact .val { flex: 1; font-size: 16px; user-select: all; }
.contact button, .contact a.btn { font-size: 12px; border: 1px solid var(--hair); border-radius: 999px; padding: 6px 12px; color: var(--ink); text-decoration: none; }
.contact button:hover, .contact a.btn:hover { border-color: var(--accent); color: var(--accent); }
.portrait { width: 100%; max-height: 380px; object-fit: cover; object-position: center 20%; border-radius: 3px; margin-bottom: 20px; }

@media (max-width: 720px) {
  .intro { left: 20px; top: 20px; right: 20px; }
  .intro h1 { font-size: 22px; }
  .hint { display: none; }
  .note { right: auto; left: 20px; bottom: auto; top: 112px; align-items: flex-start; }
  .note span { display: none; }
  .tag { font-size: 12.5px; }
  .tag .sub { display: none; }
  .panel { width: calc(100% - 20px); border-radius: 6px; }
  .panel-inner { padding: 24px 20px 50px; }
  .split, .touch, .stats { grid-template-columns: 1fr; }
  .snap { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .scene, .panel { transition: none; } }
</style>
</head>
<body>
<div class="frame">
  <div class="scene" id="scene">
    <canvas id="c" aria-hidden="true"></canvas>
    <svg class="lines" id="lines" aria-hidden="true"></svg>

  </div>
  <div class="intro">
    <h1>Moastapha <em>Al-Qaraani</em></h1>
    <p>Content manager &amp; strategist in Riyadh. Many brands, one root: a way of thinking and a team that delivers it.</p>
  </div>
  <div class="hint">pick a frond ↗</div>
  <div class="note">
    <span>maybe you'll know me better if you listen to what I like</span>
    <div class="player" id="player">
      <button type="button" id="play" aria-label="Play Mount Everest by Labrinth"><svg id="ico" width="11" height="12" viewBox="0 0 11 12" aria-hidden="true"><path d="M1 1l9 5-9 5z" fill="currentColor"/></svg></button>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>

</div>
<aside class="panel" id="panel" aria-live="polite" aria-label="Section details">

    <button class="back" id="back" type="button">← back to the palm</button>
    <div id="content"></div>
  </div>
</aside>

<script>
// ---------- content ----------
const S = {
  awal: { label: "AWAL", sub: "case study · fashion", html: `
    <p class="kicker">Case study 01 · Fashion</p>
    <h2>AWAL</h2><p class="what">Saudi near-luxury everyday basics · content lead since launch</p>
    <img class="hero" src="img/awal.jpg" alt="AWAL Instagram posts: models in neutral tees and wide jeans against stone walls">
    <h3>The challenge</h3>
    <p>A new Saudi brand launching simple pieces (tees, jeans, cargos) into a market full of loud logos and heritage clichés. No audience yet, products that are easy to copy, and a price above average that it should never have to justify.</p>
    <h3>The insight</h3>
    <p class="insight">Its people are quiet and refined. They don't want to be told what to wear or why it's worth it. They want clothes that feel like them. Belonging sells; description doesn't.</p>
    <h3>The strategy</h3>
    <div class="tiers">
      <div class="tier core"><small>The core · why the brand exists</small><div class="line"><span class="ar">يشبهك</span> Looks Like You</div><p style="margin:6px 0 0;font-size:13px;color:var(--dim)">Hero film, About page and order confirmation. Nowhere else, so it never wears out.</p></div>
      <div class="tier"><small>The signature · how every piece signs off</small><div class="line">TRY TO BE AWAL</div></div>
      <div class="touch">
        <div><strong>Motion, made refined</strong>Movement and lifestyle films</div>
        <div><strong>You'll know</strong>Product pages, macro shots, materials</div>
        <div><strong>Some things are made to be first</strong>Brand films, About page, partner decks</div>
      </div>
    </div>
    <ul style="margin-top:16px">
      <li>Arabic and English written as two voices, never translations</li>
      <li>Quiet by design: no price talk, no adjective lists, no hard selling in captions</li>
    </ul>
    <h3>The execution</h3>
    <ul>
      <li>Nine-part content strategy, from content audit to measurement</li>
      <li>Messaging architecture, website copy and the product-description format</li>
      <li>Five-scene teaser film, with silence used as the dramatic beat</li>
      <li>A modular shoot planned to feed 30+ assets; 30% identity, 70% product</li>
      <li>Low-volume cadence: 6 Instagram, 4 TikTok and 4 X posts a month</li>
    </ul>
    <h3>The outcome</h3>
    <ul><li>Launched with one consistent voice across website, social, film and gift cards</li><li>A permanent strategy now guides the brand team and its agencies</li></ul>
    <h3>Who did what</h3>
    <div class="split"><div><b>My call</b><p>The core idea and its rules, the bilingual voice, posting cadence, content ratio and every defining line.</p></div><div><b>The team's execution</b><p>Shoots by the production partner, visuals by the design team, captions by the brand's writer under my review.</p></div></div>` },

  "fg-sports": { label: "FG Sports", sub: "case study · sports business", html: `
    <p class="kicker">Case study 02 · Sports business</p>
    <h2>FG Sports</h2><p class="what">Saudi sports marketing &amp; consulting firm · Content Manager</p>
    <img class="hero" src="img/fg.jpg" alt="FG Sports posts: Brand Exposure vs Brand Recall explainer, a Red Bull F1 story and fan interviews at matches">
    <h3>The challenge</h3>
    <p>FG speaks to investors, sponsors, clubs and companies, but sports content on social media pulls toward fan reactions and hype. Doing what every sports account does would make a consulting firm look like another fan page.</p>
    <h3>The insight</h3>
    <p class="insight">Decision-makers follow sport as a market, not a match. They want to understand value (exposure, recall, ownership, investment) from someone who reads the numbers behind the game.</p>
    <h3>The strategy</h3>
    <ul>
      <li>Position FG as the industry reference for Saudi sports business, with an analyst's voice</li>
      <li>Separate pillars (why we publish) from columns (the format containers)</li>
      <li>Turn ideas into owned series: Sports Stock Market, FG Memory, Sports Term, Insight with FG</li>
      <li>Plan a full season, July to June, around the Roshn League, transfer windows and World Cup 2026</li>
    </ul>
    <h3>The execution</h3>
    <ul>
      <li>Explainers that teach the market, such as Brand Exposure vs Brand Recall</li>
      <li>Business stories, such as the road from Formula 1 fan to team owner at Red Bull</li>
      <li>On-the-ground fan interviews at matches, under FG's branding</li>
      <li>FG Fantasy league launch: a 9-post rollout, 5 fantasy influencers and a 50,000 SAR prize pool</li>
      <li>Insight with FG expanding to outside guests from across the sector</li>
    </ul>
    <h3>The outcome</h3>
    <ul><li>A distinct B2B voice that filters every trend through a strategist's lens</li><li>Recurring series that give the account a predictable, ownable rhythm</li></ul>
    <h3>Who did what</h3>
    <div class="split"><div><b>My call</b><p>B2B positioning, the pillar-and-column model, series formats, the yearly plan and the FG Fantasy concept.</p></div><div><b>The team's execution</b><p>Drafting by the brand's writer, design by the design team, field interviews by the production crew.</p></div></div>` },

  "prime-ticket": { label: "Prime Ticket", sub: "case study · ticketing", html: `
    <p class="kicker">Case study 03 · Ticketing</p>
    <h2>Prime Ticket</h2><p class="what">Saudi online ticketing platform · Content Planner since 2023</p>
    <img class="hero" src="img/prime.jpg" alt="Prime Ticket event posters: concerts in Jeddah and Riyadh and the Six Kings Slam tennis event">
    <h3>The challenge</h3>
    <p>Prime Ticket sells tickets; it doesn't organise the events. The same product goes to two very different buyers, football fans and concert-goers. Generic "tickets available" posts move neither, and paying upfront holds many back.</p>
    <h3>The insight</h3>
    <p class="insight">Football fans buy identity: being there for their club, against their rival. Concert-goers buy a cultural moment: the song, the night, the company. Both hesitate at the same place, the payment.</p>
    <h3>The strategy</h3>
    <ul>
      <li>Two registers: football speaks rivalry and loyalty; concerts speak culture, with song titles woven in</li>
      <li>One message structure: emotional hook, then urgency (the day, limited seats), then one call to action</li>
      <li>Payment flexibility (Tabby, Tamara) positioned as a barrier-remover, not an option</li>
      <li>WhatsApp copy written as a personal message, never a social caption</li>
    </ul>
    <h3>The execution</h3>
    <ul>
      <li>An approved template system for every match and concert</li>
      <li>Four copy variations per event, each built on a different motivation</li>
      <li>Tabby campaign: <span class="ar">عِش الحين، احسب بعدين</span>. The moment can't be split; the payment can.</li>
      <li>Organic content tied to live moments: title races, AFC wins, the World Cup 2026 campaign</li>
    </ul>
    <h3>The outcome</h3>
    <ul><li>A repeatable system the team applies to every new event</li><li>One consistent tone across WhatsApp, social and the website</li></ul>
    <h3>Who did what</h3>
    <div class="split"><div><b>My call</b><p>The two-register approach, the message structure, the template rules and the Tabby campaign angle.</p></div><div><b>The team's execution</b><p>Event visuals by the design team; copy variations written and published through the content workflow.</p></div></div>` },

  "more-brands": { label: "more brands", sub: "RIYD · AM PM · JMM", html: `
    <p class="kicker">Snapshots</p>
    <h2>Same method, three different answers</h2><p class="what">Three more from 8+ brands, each with its own audience and voice.</p>
    <div class="snap"><img src="img/riyd.jpg" alt="RIYD mango cheesecake posts"><div><h4>RIYD</h4><div class="sec">Desserts &amp; coffee · Riyadh</div><dl>
      <dt>Audience</dt><dd>Riyadh gatherings and gift-givers. Delivery only, no shop to visit.</dd>
      <dt>Voice</dt><dd>Warm, rhyming Gulf Arabic, with casual lowercase English.</dd>
      <dt>The strategic move</dt><dd>One umbrella line, <span class="ar">حلا لكل جمعاتكم</span>, so seasonal launches like mango build the brand instead of starting over.</dd></dl></div></div>
    <div class="snap"><img src="img/ampm.jpg" alt="AM PM posts: National Day menu, playful orange ads and an Eid post"><div><h4>AM PM</h4><div class="sec">Casual food</div><dl>
      <dt>Audience</dt><dd>Students and young professionals, 16 to 35, eating at any hour.</dd>
      <dt>Voice</dt><dd>Playful, cheeky Gulf Arabic, with a character to match.</dd>
      <dt>The strategic move</dt><dd>A post-rebrand calendar built on Saudi daily life: school runs, office breaks, Friday breakfast, match nights.</dd></dl></div></div>
    <div class="snap"><img src="img/jmm.jpg" alt="JMM agency posts about branding and advertising ideas"><div><h4>JMM <span class="ar">جَم</span></h4><div class="sec">Creative agency</div><dl>
      <dt>Audience</dt><dd>Founders and marketing directors choosing an agency.</dd>
      <dt>Voice</dt><dd>A point of view, not marketing, built on its Arabic name, meaning "abundant".</dd>
      <dt>The strategic move</dt><dd>A homepage built on the name, <span class="ar">نفس الفكرة.. بس جَم.</span>, plus four cornerstone LinkedIn essays.</dd></dl></div></div>` },

  writing: { label: "arabic writing", sub: "essays & brand lines", html: `
    <p class="kicker">Arabic writing</p>
    <h2>I write essays, not only captions</h2>

// ---------- palm drawing ----------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const linesSvg = document.getElementById("lines"), tagsEl = document.getElementById("tags");
let W = 0, H = 0, anchors = {};

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function draw() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const rnd = mulberry32(11);
  const g = () => (rnd() + rnd() + rnd() - 1.5) / 1.5; // soft gaussian
  const INK = "214,213,208";
  const dot = (x, y, a, s = 1.1) => { ctx.fillStyle = `rgba(${INK},${a})`; ctx.fillRect(x, y, s, s); };

  // sky specks
  for (let i = 0; i < W * H / 2600; i++) dot(rnd() * W, rnd() * H, rnd() * .35, rnd() < .1 ? 1.6 : 1);

  const narrow = W < 720;
  const k = Math.min(W / (narrow ? 620 : 1150), H / 820);
  const cx = narrow ? W * .5 : W * .47, baseY = H - 18;
  const top = { x: cx + 26 * k, y: H * (narrow ? .42 : .36) };
  const ctrl = { x: cx - 30 * k, y: (baseY + top.y) / 2 };

  // trunk (quadratic bezier), stippled with rings
  const bez = (t) => ({ x: (1 - t) ** 2 * cx + 2 * (1 - t) * t * ctrl.x + t * t * top.x, y: (1 - t) ** 2 * baseY + 2 * (1 - t) * t * ctrl.y + t * t * top.y });
  const len = baseY - top.y;
  for (let i = 0; i < len * 3.2; i++) {
    const t = i / (len * 3.2), p = bez(t), w = (30 - 13 * t) * k;
    const ring = Math.sin(t * len / (7.5 * k)) ;
    const n = Math.round(w * 1.25);
    for (let j = 0; j < n; j++) {
      const off = (rnd() - .5) * w, edge = Math.abs(off) / (w / 2);
      const a = (ring > .82 ? .18 : .62) * (1 - edge * .45) * (.6 + rnd() * .4);
      dot(p.x + off, p.y + g() * 1.2, a);
    }
  }

  // fronds
  const fronds = [];
  const angs = [-172, -155, -140, -124, -108, -94, -80, -64, -48, -32, -16, -4, 10, -186];
  angs.forEach((deg, i) => {
    const a = deg * Math.PI / 180;
    const side = Math.abs(Math.cos(a));
    const L = (190 + 95 * side + rnd() * 30) * k * (deg < -186 + 1 ? .8 : 1);
    const droop = (.12 + .75 * side) * (deg > 0 || deg < -180 ? 1.2 : 1);
    const pt = (t) => ({ x: top.x + Math.cos(a) * L * t, y: top.y + Math.sin(a) * L * t + droop * L * t * t });
    fronds.push({ deg, pt });
    // rachis
    for (let s = 0; s < L * 2.2; s++) { const t = s / (L * 2.2), p = pt(t); const w = (3.2 * (1 - t) + .8) * k; dot(p.x + g() * w, p.y + g() * w, .7); }
    // leaflets
    for (let t = .1; t < .99; t += .024) {
      const p = pt(t), q = pt(t + .01);
      const tx = q.x - p.x, ty = q.y - p.y, tl = Math.hypot(tx, ty) || 1;
      const ux = tx / tl, uy = ty / tl;
      const ll = L * .2 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.08)), .65) * (.8 + rnd() * .35);
      [-1, 1].forEach((sd) => {
        const ang = sd * (.95 + rnd() * .2);
        let dx = ux * Math.cos(ang) - uy * Math.sin(ang), dy = ux * Math.sin(ang) + uy * Math.cos(ang);
        dy += .55; const dl = Math.hypot(dx, dy); dx /= dl; dy /= dl;
        const steps = ll * 1.6;
        for (let s = 0; s < steps; s++) {
          const u = s / steps, w = 2.4 * (1 - u) * k;
          dot(p.x + dx * ll * u + g() * w, p.y + dy * ll * u + dy * u * u * ll * .25 + g() * w, .55 * (1 - u * .5));
        }
      });
    }
  });
  // crown cluster
  for (let i = 0; i < 900 * k; i++) dot(top.x + g() * 14 * k, top.y + g() * 10 * k, .7);

  // grass tufts
  for (let i = 0; i < W / 5; i++) {
    const x = rnd() * W, h = (6 + rnd() * 26) * (Math.abs(x - cx) < 200 * k ? 1.3 : 1);
    const lean = (rnd() - .5) * 8;
    for (let s = 0; s < h * 1.6; s++) { const u = s / (h * 1.6); dot(x + lean * u * u + g() * .6, baseY + 6 - h * u, .5 * (1 - u * .6)); }
    if (rnd() < .08) for (let j = 0; j < 30; j++) dot(x + lean + g() * 2.5, baseY + 6 - h + g() * 2.5, .6);
  }
  for (let i = 0; i < W * 1.2; i++) dot(rnd() * W, baseY + 2 + rnd() * 12, .35);

  // nav anchors on chosen fronds
  const pick = (deg) => fronds.find((f) => f.deg === deg);
  anchors = {
    awal: { f: pick(-140), t: .8, side: "left" },
    "fg-sports": { f: pick(-155), t: .97, side: "left" },
    "prime-ticket": { f: pick(-186), t: .92, side: "left" },
    "more-brands": { f: pick(-48), t: .82, side: "right" },
    writing: { f: pick(-16), t: .9, side: "right" },
    me: { f: pick(10), t: .9, side: "right" },
  };
  Object.values(anchors).forEach((o) => { o.p = o.f.pt(o.t); });
  anchors.lead = { p: { x: cx + 14 * k, y: baseY - 26 * k }, side: "right", far: true };
  anchors.contact = { p: { x: cx - 16 * k, y: baseY - 60 * k }, side: "left", far: true };
  placeTags(k);
}

function placeTags(k) {
  linesSvg.innerHTML = ""; tagsEl.innerHTML = "";
  const narrow = W < 720;
  Object.entries(anchors).forEach(([id, o]) => {
    const dx = (narrow ? 26 : 70) * (o.side === "left" ? -1 : 1) * (o.far ? 1.4 : 1);
    const ly = o.p.y - (o.far ? 0 : 8);
    const lx = o.p.x + dx;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M${o.p.x},${o.p.y} Q${(o.p.x + lx) / 2},${ly - 6} ${lx},${ly}`);
    linesSvg.appendChild(path);
    const b = document.createElement("button");
    b.type = "button"; b.className = "tag " + o.side; b.dataset.open = id;
    b.innerHTML = `${S[id].label}${S[id].sub ? `<span class="sub">${S[id].sub}</span>` : ""}`;
    tagsEl.appendChild(b);
    const bw = b.offsetWidth, bh = b.offsetHeight;
    let x = o.side === "left" ? lx - bw - 6 : lx + 6;
    x = Math.max(8, Math.min(W - bw - 8, x));
    b.style.left = x + "px"; b.style.top = (ly - 14) + "px";
    o.lx = lx; o.ly = ly;
  });
}

// ---------- open / close ----------
const scene = document.getElementById("scene"), content = document.getElementById("content");
let current = null;
function open(id, fromHash) {
  if (!S[id]) return;
  current = id;
  content.innerHTML = S[id].html;
  document.body.classList.add("open");
  document.querySelectorAll(".tag").forEach((t) => t.setAttribute("aria-current", t.dataset.open === id ? "true" : "false"));
  const o = anchors[id];
  const narrow = W < 720, s = narrow ? 1.25 : 1.7;
  const tx = (narrow ? W * .5 : W * .26) - o.p.x, ty = (narrow ? H * .2 : H * .5) - o.p.y;
  scene.style.transformOrigin = `${o.p.x}px ${o.p.y}px`;
  scene.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  document.getElementById("panel").scrollTop = 0;
  if (!fromHash && location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  setTimeout(() => document.getElementById("back").focus({ preventScroll: true }), 50);
}
function close() {
  if (!current) return;
  const was = current; current = null;
  document.body.classList.remove("open");
  scene.style.transform = "";
  document.querySelectorAll(".tag").forEach((t) => t.removeAttribute("aria-current"));
  history.replaceState(null, "", location.pathname + location.search);
  const t = document.querySelector(`.tag[data-open="${was}"]`); if (t) t.focus({ preventScroll: true });
}
document.addEventListener("click", (e) => {
  const o = e.target.closest("[data-open]"); if (o) { open(o.dataset.open); return; }
  const c = e.target.closest("[data-copy]");
  if (c) { navigator.clipboard.writeText(c.dataset.copy).then(() => { c.textContent = "copied"; }, () => { c.textContent = "select & copy"; }); }
});
document.getElementById("back").addEventListener("click", close);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (S[h]) open(h, true); else close(); });

// ---------- music (YouTube player, starts only on click) ----------
let yt = null, ytReady = false, wantPlay = false;
const playerEl = document.getElementById("player"), ico = document.getElementById("ico"), playBtn = document.getElementById("play");
const PLAY = '<path d="M1 1l9 5-9 5z" fill="currentColor"/>', PAUSE = '<path d="M1 1h3v10H1zM7 1h3v10H7z" fill="currentColor"/>';
function setOn(on) { playerEl.classList.toggle("on", on); ico.innerHTML = on ? PAUSE : PLAY; playBtn.setAttribute("aria-label", (on ? "Pause" : "Play") + " Mount Everest by Labrinth"); }
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player("yt", { width: 1, height: 1, videoId: "kwrYDTHKxiE", playerVars: { playsinline: 1, controls: 0 },
    events: {
      onReady: () => { ytReady = true; yt.setVolume(70); if (wantPlay) yt.playVideo(); },
      onStateChange: (e) => setOn(e.data === 1 || e.data === 3),
      onError: () => { setOn(false); window.open("https://www.youtube.com/watch?v=kwrYDTHKxiE", "_blank", "noopener"); },
    } });
};
function loadYT() { if (document.getElementById("yt-api")) return; const t = document.createElement("script"); t.id = "yt-api"; t.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(t); }
playBtn.addEventListener("click", () => {
  if (!ytReady) { wantPlay = true; setOn(true); loadYT(); return; }
  const st = yt.getPlayerState();
  if (st === 1 || st === 3) yt.pauseVideo(); else yt.playVideo();
});

let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { draw(); if (current) open(current, true); }, 150); });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  draw();
  const h = location.hash.slice(1); if (S[h]) open(h, true);
});
draw();
</script>
