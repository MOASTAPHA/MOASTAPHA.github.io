<style>
:root {
  /* One visual world: a piano keyboard over a night room. Pressing a key drops a beam of light; I stand in it; the room opens beside the beam. */
  --night: #0b0f19;
  --night-2: #121828;
  --ink: #e6e3da;
  --dim: #8d93a1;
  --hair: #283149;
  --accent: #e8573f;
  --ivory: #f2eee4;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --keys-h: min(30vh, 250px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--body); font-weight: 300; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 1px dashed var(--accent); outline-offset: 3px; }

/* keyboard */
.keys { position: absolute; left: 0; right: 0; top: 0; height: var(--keys-h); display: flex; gap: 3px; padding: 0 3px; background: #04060b; z-index: 3; }
.w { flex: 1; position: relative; background: linear-gradient(#f6f3ea, #e7e1d2); border-radius: 0 0 6px 6px; box-shadow: inset 0 -6px 0 #d4ccb8; display: flex; align-items: flex-end; justify-content: center; padding: 0 2px 16px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #6d6a62; text-align: center; line-height: 1.3; transition: transform .08s, box-shadow .08s, background .3s, color .3s; }
.w:hover { background: linear-gradient(#fffdf7, #efe9db); }
.w.down { transform: translateY(3px); box-shadow: inset 0 -2px 0 #d4ccb8; }
.w.lit { background: linear-gradient(#ffffff, #fbf8f1); color: var(--accent); box-shadow: inset 0 -2px 0 #e9e1cf; }
.b { position: absolute; top: 0; height: 60%; background: linear-gradient(#232a3c, #090c14); border-radius: 0 0 4px 4px; box-shadow: 0 3px 0 #000, inset 0 -4px 0 #1a2030; z-index: 4; transition: transform .08s, background .3s; }
.b:hover { background: linear-gradient(#2c3550, #10141f); }
.b.down { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
.b.lit { background: linear-gradient(#3a2622, #170d0b); }

/* beam + me */
.room { position: absolute; left: 0; right: 0; top: var(--keys-h); bottom: 0; overflow: hidden; }
.beam { position: absolute; top: 0; bottom: 0; width: 80px; background: linear-gradient(rgba(246,243,234,.95), rgba(246,243,234,.6) 35%, rgba(246,243,234,.14) 88%, rgba(246,243,234,.04)); transform-origin: top; transition: left .9s cubic-bezier(.6,0,.25,1), width .9s cubic-bezier(.6,0,.25,1), transform .5s ease-out; }
.beam.drop { animation: drop .7s cubic-bezier(.3,0,.2,1); }
@keyframes drop { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.halo { position: absolute; top: 0; bottom: 0; width: 360px; background: radial-gradient(ellipse at 50% 92%, rgba(232,87,63,.16), transparent 62%), radial-gradient(ellipse at 50% 10%, rgba(246,243,234,.08), transparent 55%); pointer-events: none; transition: left .9s cubic-bezier(.6,0,.25,1); }
.me { position: absolute; bottom: 0; height: min(30vh, 250px); transition: left 1.1s cubic-bezier(.6,0,.25,1); filter: drop-shadow(0 0 1px rgba(0,0,0,.6)); -webkit-mask-image: linear-gradient(#000 82%, transparent); mask-image: linear-gradient(#000 82%, transparent); pointer-events: none; }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: linear-gradient(transparent, rgba(0,0,0,.35)); pointer-events: none; }

/* resting text */
.name { position: absolute; right: 48px; bottom: 44px; text-align: right; z-index: 2; transition: opacity .5s; }
.name h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 4.4vw, 54px); line-height: 1.02; color: var(--ivory); }
.name h1 em { color: var(--accent); }
.name p { margin: 8px 0 0; font-size: 13px; color: var(--dim); letter-spacing: .04em; }
.prompt { position: absolute; top: 20px; font-family: var(--display); font-style: italic; font-size: 15px; color: var(--dim); z-index: 2; transition: left .9s cubic-bezier(.6,0,.25,1), opacity .4s; white-space: nowrap; }
.dock { position: absolute; left: 32px; bottom: 30px; display: flex; gap: 10px; align-items: center; z-index: 4; }
.pill { display: flex; align-items: center; gap: 10px; background: rgba(230,227,218,.92); color: var(--night); border-radius: 999px; padding: 6px 14px 6px 8px; font-size: 12.5px; font-weight: 500; }
.pill button, .pill a { color: var(--night); text-decoration: none; }
.pill button { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; }
.pill button:hover, .pill a:hover { color: var(--accent); }
.eq { display: flex; gap: 2px; align-items: flex-end; height: 11px; width: 12px; }
.eq i { width: 2px; height: 3px; background: currentColor; border-radius: 1px; }
.pill.on .eq i { animation: eq .9s ease-in-out infinite alternate; }
.pill.on .eq i:nth-child(2) { animation-delay: .25s; } .pill.on .eq i:nth-child(3) { animation-delay: .5s; }
@keyframes eq { from { height: 2px; } to { height: 11px; } }
.sound { font-size: 12px; color: var(--dim); border: 1px solid var(--hair); border-radius: 999px; padding: 7px 12px; }
.sound:hover { color: var(--ink); border-color: var(--dim); }
.fade { display: none; position: absolute; top: 0; right: 0; width: 48px; height: var(--keys-h); background: linear-gradient(90deg, transparent, rgba(4,6,11,.85)); pointer-events: none; z-index: 5; }
.name .tip { display: none; margin-top: 10px; font-family: var(--display); font-style: italic; font-size: 14px; color: var(--dim); letter-spacing: 0; }
#yt { position: absolute; width: 1px; height: 1px; left: -9999px; top: 0; }
body.open .name { opacity: 0; }

/* essay whisper (black keys) */
.whisper { position: absolute; z-index: 6; top: calc(var(--keys-h) + 14px); max-width: 300px; background: rgba(11,15,25,.96); border: 1px solid var(--hair); border-radius: 6px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.whisper .ar { display: block; font-size: 18px; font-weight: 500; text-align: right; line-height: 1.5; }
.whisper small { display: block; margin-top: 4px; font-size: 11.5px; color: var(--dim); }
.whisper a { color: var(--accent); text-decoration: none; }

/* panel */
.panel { position: absolute; top: calc(var(--keys-h) + 22px); bottom: 84px; width: min(560px, 46vw); background: rgba(14,19,31,.94); backdrop-filter: blur(6px); border: 1px solid var(--hair); border-radius: 8px; overflow-y: auto; z-index: 5; opacity: 0; pointer-events: none; transform: translateY(12px); transition: opacity .45s .35s, transform .45s .35s; }
body.open .panel { opacity: 1; pointer-events: auto; transform: none; }
.panel-inner { padding: 28px 34px 50px; }
.close { position: sticky; top: 0; float: right; margin: -8px -14px 0 0; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.06); color: var(--dim); font-size: 16px; }
.close:hover { color: var(--accent); }
.kicker { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 3.2vw, 38px); line-height: 1.05; margin: 0 0 8px; text-wrap: balance; }
.panel .what { color: var(--dim); font-size: 13px; margin: 0 0 22px; }
.panel h3 { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); font-weight: 500; margin: 26px 0 10px; padding-top: 14px; border-top: 1px solid var(--hair); }
.panel p { line-height: 1.65; font-size: 14.5px; margin: 0 0 12px; }
.panel .insight { font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.4; }
.panel ul { margin: 0; padding: 0 0 0 18px; display: grid; gap: 8px; font-size: 14px; line-height: 1.55; }
.panel li::marker { color: var(--accent); }
.panel img.hero { width: 100%; border-radius: 4px; display: block; margin: 0 0 20px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.split > div { background: rgba(255,255,255,.04); padding: 14px 16px; border-radius: 5px; }
.split b { display: block; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 500; margin-bottom: 6px; color: var(--accent); }
.split > div:last-child b { color: var(--dim); }
.split p { font-size: 13px; margin: 0; }
.ar { font-family: var(--body); direction: rtl; unicode-bidi: isolate; }
.tiers { display: grid; gap: 10px; }
.tier { padding: 14px 16px; border: 1px solid var(--hair); border-radius: 5px; }
.tier small { display: block; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
.tier .line { font-family: var(--display); font-size: 22px; }
.tier.core { border-color: var(--accent); }
.tier.core .line .ar { color: var(--accent); margin-right: 10px; }
.touch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.touch div { font-size: 12.5px; color: var(--dim); }
.touch div strong { display: block; font-family: var(--display); font-weight: 400; font-size: 16px; color: var(--ink); margin-bottom: 3px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 6px 0 4px; }
.stats div { border-top: 1px solid var(--hair); padding-top: 10px; font-size: 12.5px; color: var(--dim); line-height: 1.4; }
.stats strong { display: block; font-family: var(--display); font-weight: 400; font-size: 34px; color: var(--accent); line-height: 1; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.steps { counter-reset: s; display: grid; gap: 12px; }
.steps div { display: grid; grid-template-columns: 34px 1fr; gap: 4px 10px; }
.steps div::before { counter-increment: s; content: "0" counter(s); font-family: var(--display); font-style: italic; color: var(--accent); font-size: 18px; grid-row: span 2; }
.steps strong { font-weight: 500; font-size: 14.5px; }
.steps span { font-size: 13.5px; color: var(--dim); line-height: 1.5; }
.roles div { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 14px; }
.roles div span { color: var(--dim); font-size: 12.5px; }
.roles div em { font-style: normal; color: var(--accent); font-size: 12px; grid-row: span 2; align-self: center; }
.snap { display: grid; grid-template-columns: 140px 1fr; gap: 18px; padding: 18px 0; border-top: 1px solid var(--hair); }
.snap img { width: 100%; border-radius: 3px; }
.snap h4 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 2px; }
.snap .sec { font-size: 12px; color: var(--dim); margin-bottom: 10px; }
.snap dl { margin: 0; display: grid; gap: 6px; font-size: 13px; line-height: 1.5; }
.snap dt { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.snap dd { margin: 0; }
.quote { padding: 18px 0; border-top: 1px solid var(--hair); }
.quote .ar { display: block; font-size: 24px; font-weight: 500; line-height: 1.5; text-align: right; }
.quote .meta { font-size: 12.5px; color: var(--dim); line-height: 1.6; margin-top: 8px; }
.quote .meta b { color: var(--accent); font-weight: 500; letter-spacing: .12em; text-transform: uppercase; font-size: 10.5px; margin-right: 6px; }
.essays { display: grid; }
.essay { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--hair); color: var(--ink); text-decoration: none; }
.essay .ar { font-size: 17px; font-weight: 500; order: 2; text-align: right; }
.essay small { color: var(--dim); font-size: 11.5px; white-space: nowrap; order: 1; }
.essay:hover .ar { color: var(--accent); }
.essay.feat .ar { font-size: 20px; } .essay.feat small { color: var(--accent); }
.more-link { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent); }
.contact div { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--hair); }
.contact small { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); width: 90px; }
.contact .val { flex: 1; font-size: 16px; user-select: all; }
.contact button, .contact a.btn { font-size: 12px; border: 1px solid var(--hair); border-radius: 999px; padding: 6px 12px; color: var(--ink); text-decoration: none; }
.contact button:hover, .contact a.btn:hover { border-color: var(--accent); color: var(--accent); }
.portrait { width: 100%; max-height: 360px; object-fit: cover; object-position: center 20%; border-radius: 4px; margin-bottom: 20px; }

@media (max-width: 720px) {
  :root { --keys-h: 168px; }
  .keys { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
  .keys::-webkit-scrollbar { display: none; }
  .w { flex: 0 0 76px; font-size: 10.5px; letter-spacing: .1em; padding: 0 4px 14px; }
  .fade { display: block; }
  .name { left: 20px; right: 20px; top: calc(var(--keys-h) + 22px); bottom: auto; text-align: left; }
  .name h1 { font-size: 32px; }
  .name p { font-size: 12.5px; }
  .name .tip { display: block; }
  .prompt { display: none; }
  .me { height: 25vh; bottom: 74px; }
  .floor { display: none; }
  .beam { opacity: .82; }
  .name h1, .name p { text-shadow: 0 0 3px rgba(11,15,25,.95), 0 0 10px rgba(11,15,25,.95), 0 0 22px rgba(11,15,25,.8); }
  .me { -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .dock { left: 14px; right: 14px; bottom: 16px; justify-content: space-between; }
  .pill { font-size: 12px; }
  .whisper { left: 14px !important; right: 14px; max-width: none; }
  .panel { left: 0 !important; right: 0; width: auto; top: auto; height: 82%; bottom: 0; border-radius: 16px 16px 0 0; border-bottom: 0; transform: translateY(30px); }
  .panel-inner { padding: 18px 20px 48px; }
  .panel-inner::before { content: ""; display: block; width: 42px; height: 4px; border-radius: 2px; background: var(--hair); margin: 0 auto 14px; }
  .close { width: 40px; height: 40px; font-size: 20px; margin: -4px -6px 0 0; }
  .panel h2 { font-size: 28px; }
  .panel p, .panel ul { font-size: 15px; }
  .split, .touch, .stats { grid-template-columns: 1fr; }
  .snap { grid-template-columns: 1fr; }
  .essay .ar { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { .beam, .halo, .me, .prompt, .panel { transition: none; } .beam.drop { animation: none; } }

.panel .wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.wcard { display: flex; flex-direction: column; text-align: left; background: rgba(255,255,255,.035); border: 1px solid var(--hair); border-radius: 6px; overflow: hidden; transition: border-color .25s, transform .25s; }
.wcard:hover, .wcard:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
.wcard img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; border-bottom: 1px solid var(--hair); }
.wcard span { padding: 0 12px; }
.wcard .wb { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-top: 11px; }
.wcard .wt { font-size: 14px; color: var(--ink); line-height: 1.35; margin: 4px 0 2px; }
.wcard .wp { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
.wcard .wd { font-size: 12.5px; color: var(--dim); line-height: 1.5; }
.wcard .ws { font-size: 12.5px; color: var(--ink); line-height: 1.45; margin: 8px 0 12px; font-style: italic; opacity: .85; }
.note-req { font-size: 12px; color: var(--dim); margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--hair); }
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(6,9,16,.95); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; }
.lb[hidden] { display: none; }
.lb img { max-width: min(1280px, 94vw); max-height: 78vh; border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.lb .lbbar { display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 12.5px; }
.lb button { border: 1px solid var(--hair); border-radius: 999px; padding: 7px 14px; color: var(--ink); font-size: 13px; }
.lb button:hover { border-color: var(--accent); color: var(--accent); }
@media (max-width: 720px) { .panel .wgrid { grid-template-columns: 1fr; } }
</style>
</head>

<div class="keys" id="keys" role="navigation" aria-label="Piano keys: each key opens a section"></div>
<div class="fade" aria-hidden="true"></div>

  <div class="beam" id="beam"></div>
  <img class="me" id="me" src="../img/silhouette.png" alt="">
  <div class="floor"></div>
  <div class="prompt" id="prompt">every key opens a room. press one.</div>
</div>
<div class="name"><h1>Moastapha <em>Al-Qaraani</em></h1><p>Content Manager &amp; Strategist · Riyadh</p><p class="tip">swipe the keys, tap one →</p></div>
<div class="dock">
  <div class="pill" id="player">
    <button type="button" id="play" aria-label="Play That's Life by Frank Sinatra"><svg id="ico" width="11" height="12" viewBox="0 0 11 12" aria-hidden="true"><path d="M1 1l9 5-9 5z" fill="currentColor"/></svg></button>
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>

<script>
const S = {
  awal: { label: "AWAL", sub: "case study · fashion", html: `
    <p class="kicker">Case study 01 · Fashion</p>
    <h2>AWAL</h2><p class="what">Saudi near-luxury everyday basics · content lead since launch</p>
    <img class="hero" src="../img/awal.jpg" alt="AWAL Instagram posts: models in neutral tees and wide jeans against stone walls">
    <h3>The challenge</h3>
    <p>A new Saudi brand launching simple pieces (tees, jeans, cargos) into a market full of loud logos and heritage clichés. No audience yet, products that are easy to copy, and a price above average that it should never have to justify.</p>
    <h3>The insight</h3>
    <p class="insight">Its people are quiet and refined. They don't want to be told what to wear or why it's worth it. They want clothes that feel like them. Belonging sells; description doesn't.</p>
    <h3>The strategy</h3>
    <div class="tiers">
      <div class="tier core"><small>The core · why the brand exists</small><div class="line"><span class="ar">يشبهك</span> Looks Like You</div><p style="margin:6px 0 0;font-size:13px;color:var(--dim)">Hero film, About page and order confirmation. Nowhere else, so it never wears out.</p></div>
      <div class="tier"><small>The signature · how every piece signs off</small><div class="line">TRY TO BE AWAL</div></div>
      <div class="touch">
        <div><strong>Motion, made refined</strong>Movement and lifestyle films</div>
        <div><strong>You'll know</strong>Product pages, macro shots, materials</div>
        <div><strong>Some things are made to be first</strong>Brand films, About page, partner decks</div>
      </div>
    </div>
    <ul style="margin-top:16px">
      <li>Arabic and English written as two voices, never translations</li>
      <li>Quiet by design: no price talk, no adjective lists, no hard selling in captions</li>
    </ul>
    <h3>The execution</h3>
    <ul>
      <li>Nine-part content strategy, from content audit to measurement</li>
      <li>Messaging architecture, website copy and the product-description format</li>
      <li>Five-scene teaser film, with silence used as the dramatic beat</li>
      <li>A modular shoot planned to feed 30+ assets; 30% identity, 70% product</li>
      <li>Low-volume cadence: 6 Instagram, 4 TikTok and 4 X posts a month</li>
    </ul>
    <h3>The outcome</h3>
    <ul><li>Launched with one consistent voice across website, social, film and gift cards</li><li>A permanent strategy now guides the brand team and its agencies</li></ul>

  "fg-sports": { label: "FG Sports", sub: "case study · sports business", html: `
    <p class="kicker">Case study 02 · Sports business</p>
    <h2>FG Sports</h2><p class="what">Saudi sports marketing &amp; consulting firm · Content Manager</p>
    <img class="hero" src="../img/fg.jpg" alt="FG Sports posts: Brand Exposure vs Brand Recall explainer, a Red Bull F1 story and fan interviews at matches">
    <h3>The challenge</h3>
    <p>FG speaks to investors, sponsors, clubs and companies, but sports content on social media pulls toward fan reactions and hype. Doing what every sports account does would make a consulting firm look like another fan page.</p>
    <h3>The insight</h3>
    <p class="insight">Decision-makers follow sport as a market, not a match. They want to understand value (exposure, recall, ownership, investment) from someone who reads the numbers behind the game.</p>
    <h3>The strategy</h3>
    <ul>
      <li>Position FG as the industry reference for Saudi sports business, with an analyst's voice</li>
      <li>Separate pillars (why we publish) from columns (the format containers)</li>
      <li>Turn ideas into owned series: Sports Stock Market, FG Memory, Sports Term, Insight with FG</li>
      <li>Plan a full season, July to June, around the Roshn League, transfer windows and World Cup 2026</li>
    </ul>
    <h3>The execution</h3>
    <ul>
      <li>Explainers that teach the market, such as Brand Exposure vs Brand Recall</li>
      <li>Business stories, such as the road from Formula 1 fan to team owner at Red Bull</li>
      <li>On-the-ground fan interviews at matches, under FG's branding</li>
      <li>FG Fantasy league launch: a 9-post rollout, 5 fantasy influencers and a 50,000 SAR prize pool</li>
      <li>Insight with FG expanding to outside guests from across the sector</li>
    </ul>
    <h3>The outcome</h3>
    <ul><li>A distinct B2B voice that filters every trend through a strategist's lens</li><li>Recurring series that give the account a predictable, ownable rhythm</li></ul>
    <h3>Who did what</h3>
    <p><button type="button" class="more-link" data-open="work">See the FG quarterly frameworks →</button></p>
    <div class="split"><div><b>My call</b><p>B2B positioning, the pillar-and-column model, series formats, the yearly plan and the FG Fantasy concept.</p></div><div><b>The team's execution</b><p>Drafting by the brand's writer, design by the design team, field interviews by the production crew.</p></div></div>` },

  "prime-ticket": { label: "Prime Ticket", sub: "case study · ticketing", html: `
    <p class="kicker">Case study 03 · Ticketing</p>
    <h2>Prime Ticket</h2><p class="what">Saudi online ticketing platform · Content Planner since 2023</p>
    <img class="hero" src="../img/prime.jpg" alt="Prime Ticket event posters: concerts in Jeddah and Riyadh and the Six Kings Slam tennis event">
    <h3>The challenge</h3>
    <p>Prime Ticket sells tickets; it doesn't organise the events. The same product goes to two very different buyers, football fans and concert-goers. Generic "tickets available" posts move neither, and paying upfront holds many back.</p>
    <h3>The insight</h3>
    <p class="insight">Football fans buy identity: being there for their club, against their rival. Concert-goers buy a cultural moment: the song, the night, the company. Both hesitate at the same place, the payment.</p>
    <h3>The strategy</h3>
    <ul>
      <li>Two registers: football speaks rivalry and loyalty; concerts speak culture, with song titles woven in</li>
      <li>One message structure: emotional hook, then urgency (the day, limited seats), then one call to action</li>
      <li>Payment flexibility (Tabby, Tamara) positioned as a barrier-remover, not an option</li>
      <li>WhatsApp copy written as a personal message, never a social caption</li>
    </ul>
    <h3>The execution</h3>
    <ul>
      <li>An approved template system for every match and concert</li>
      <li>Four copy variations per event, each built on a different motivation</li>
      <li>Tabby campaign: <span class="ar">عِش الحين، احسب بعدين</span>. The moment can't be split; the payment can.</li>
      <li>Organic content tied to live moments: title races, AFC wins, the World Cup 2026 campaign</li>
    </ul>
    <h3>The outcome</h3>
    <ul><li>A repeatable system the team applies to every new event</li><li>One consistent tone across WhatsApp, social and the website</li></ul>
    <h3>Who did what</h3>
    <div class="split"><div><b>My call</b><p>The two-register approach, the message structure, the template rules and the Tabby campaign angle.</p></div><div><b>The team's execution</b><p>Event visuals by the design team; copy variations written and published through the content workflow.</p></div></div>` },

  ["اللامكان: عن العيش في مساحات لا تتذكّرنا", "Jun 2026", "/p/اللامكان-عن-العيش-في-مساحات-لا-تتذكرنا-c0e42"],
];
const keysEl = document.getElementById("keys");
const whites = [], blacks = [];
WHITE.forEach((id, i) => {
  const w = document.createElement("button");
  w.type = "button"; w.className = "w"; w.dataset.i = i;
  if (id) { w.dataset.id = id; w.textContent = S[id].label; w.setAttribute("aria-label", "Open " + S[id].label); }
  else { w.setAttribute("aria-label", "Play a note"); w.tabIndex = -1; }
  keysEl.appendChild(w); whites.push(w);
});
let essayIdx = 0;
function placeBlacks() {
  blacks.forEach((b) => b.remove()); blacks.length = 0; essayIdx = 0;
  const kr = keysEl.getBoundingClientRect();
  whites.forEach((w, i) => {
    if (i >= whites.length - 1 || !BLACK_AFTER[i % 7]) return;
    const r = w.getBoundingClientRect(), bw = r.width * .58;
    const b = document.createElement("button");
    b.type = "button"; b.className = "b"; b.style.left = (r.right - kr.left + keysEl.scrollLeft + 1.5 - bw / 2) + "px"; b.style.width = bw + "px";
    b.dataset.semi = semiOfWhite(i) + 1;
    const e = ESSAYS[essayIdx++ % ESSAYS.length]; b.dataset.essay = essayIdx - 1;
    b.setAttribute("aria-label", "Essay: " + e[0]);
    keysEl.appendChild(b); blacks.push(b);
  });
}
function semiOfWhite(i) { const oct = Math.floor(i / 7), d = [0, 2, 4, 5, 7, 9, 11][i % 7]; return oct * 12 + d; }

// ---------- sound: a soft piano-like note made in the browser ----------
let actx = null, soundOn = true;
function note(semi, vel = .22) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const f = 220 * Math.pow(2, (semi + 3) / 12), t = actx.currentTime;
    const out = actx.createGain(); out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(vel, t + .006); out.gain.exponentialRampToValueAtTime(.0008, t + 2.2);
    const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.setValueAtTime(Math.min(5200, f * 9), t); lp.frequency.exponentialRampToValueAtTime(f * 2.2, t + 1.4);
    lp.connect(out); out.connect(actx.destination);
    [[1, "triangle", 1], [2, "sine", .35], [3, "sine", .12], [.5, "sine", .18]].forEach(([m, type, g]) => {
      const o = actx.createOscillator(), og = actx.createGain(); o.type = type; o.frequency.value = f * m; o.detune.value = (Math.random() - .5) * 4;
      og.gain.value = g; o.connect(og); og.connect(lp); o.start(t); o.stop(t + 2.3);
    });
  } catch (e) { /* audio unavailable: stay silent */ }
}
const soundBtn = document.getElementById("sound");
soundBtn.addEventListener("click", () => { soundOn = !soundOn; soundBtn.textContent = soundOn ? "♪ keys on" : "♪ keys off"; soundBtn.setAttribute("aria-pressed", soundOn); });

// ---------- beam, me, panel ----------
const beam = document.getElementById("beam"), halo = document.getElementById("halo"), me = document.getElementById("me"), prompt = document.getElementById("prompt");
const panel = document.getElementById("panel"), content = document.getElementById("content"), whisper = document.getElementById("whisper");
let litIndex = innerWidth <= 720 ? 2 : 6, current = null;
function lightKey(i, animate) {
  litIndex = i;
  whites.forEach((w, j) => w.classList.toggle("lit", j === i));
  const kr = keysEl.getBoundingClientRect(), r = whites[i].getBoundingClientRect();
  const x = r.left - kr.left;
  beam.style.left = x + "px"; beam.style.width = r.width + "px";
  halo.style.left = (x + r.width / 2 - 180) + "px";
  const mw = me.getBoundingClientRect().width || 120;
  me.style.left = (x + r.width / 2 - mw / 2) + "px";
  const pw = prompt.getBoundingClientRect().width;
  prompt.style.left = (x + r.width + 18 + pw > innerWidth - 16 ? x - pw - 18 : x + r.width + 18) + "px";
  if (animate) { beam.classList.remove("drop"); void beam.offsetWidth; beam.classList.add("drop"); }
  return { x, w: r.width };
}
function placePanel(x, w) {
  if (innerWidth <= 720) { panel.style.left = ""; return; }
  const pw = Math.min(560, innerWidth * .46);
  const right = x + w + 36, left = x - 36 - pw;
  panel.style.left = (right + pw <= innerWidth - 24 ? right : Math.max(24, left)) + "px";
}
function open(id, fromHash) {
  if (!S[id]) return;
  const i = whites.findIndex((w) => w.dataset.id === id);
  if (innerWidth <= 720) { const r = whites[i].getBoundingClientRect(); if (r.left < 0 || r.right > innerWidth) keysEl.scrollLeft += r.left - innerWidth / 2 + r.width / 2; }
  const { x, w } = lightKey(i, true);
  current = id; content.innerHTML = S[id].html; panel.scrollTop = 0;
  placePanel(x, w);
  document.body.classList.add("open"); prompt.style.opacity = 0; hideWhisper();
  if (!fromHash && location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
}
function close() {
  if (!current) return; current = null;
  document.body.classList.remove("open"); prompt.style.opacity = 1;
  history.replaceState(null, "", location.pathname + location.search);
}
function showWhisper(b) {
  const e = ESSAYS[+b.dataset.essay];
  whisper.innerHTML = `<span class="ar">${e[0]}</span><small>an essay · ${e[1]} · <a href="${K + e[2]}" target="_blank" rel="noopener">read on Kitabh ↗</a></small>`;
  whisper.hidden = false;
  const r = b.getBoundingClientRect(), ww = whisper.offsetWidth;
  whisper.style.left = Math.max(12, Math.min(innerWidth - ww - 12, r.left + r.width / 2 - ww / 2)) + "px";
}
function hideWhisper() { whisper.hidden = true; blacks.forEach((b) => b.classList.remove("lit")); }

function press(el) { el.classList.add("down"); setTimeout(() => el.classList.remove("down"), 140); }
keysEl.addEventListener("click", (e) => {
  const k = e.target.closest(".w, .b"); if (!k) return;
  press(k);
  if (k.classList.contains("b")) { note(+k.dataset.semi, .18); blacks.forEach((b) => b.classList.toggle("lit", b === k)); showWhisper(k); return; }
  note(semiOfWhite(+k.dataset.i));
  if (k.dataset.id) open(k.dataset.id); else { hideWhisper(); if (!current) lightKey(+k.dataset.i, true); }
});
document.getElementById("close").addEventListener("click", close);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { close(); hideWhisper(); } });
document.addEventListener("click", (e) => {
  if (!whisper.hidden && !whisper.contains(e.target) && !e.target.closest(".b")) hideWhisper();
  const c = e.target.closest("[data-copy]");
  if (c) navigator.clipboard.writeText(c.dataset.copy).then(() => { c.textContent = "copied"; }, () => { c.textContent = "select & copy"; });
  const o = e.target.closest("[data-open]"); if (o && S[o.dataset.open]) open(o.dataset.open);
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (S[h]) open(h, true); else close(); });

// ---------- music (YouTube, starts only on click) ----------
let yt = null, ytReady = false, wantPlay = false;
const playerEl = document.getElementById("player"), ico = document.getElementById("ico"), playBtn = document.getElementById("play");
const PLAY = '<path d="M1 1l9 5-9 5z" fill="currentColor"/>', PAUSE = '<path d="M1 1h3v10H1zM7 1h3v10H7z" fill="currentColor"/>';
function setOn(on) { playerEl.classList.toggle("on", on); ico.innerHTML = on ? PAUSE : PLAY; playBtn.setAttribute("aria-label", (on ? "Pause" : "Play") + " That's Life by Frank Sinatra"); }
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player("yt", { width: 1, height: 1, videoId: "UCENTf_LWYA", playerVars: { playsinline: 1, controls: 0 },
    events: { onReady: () => { ytReady = true; yt.setVolume(70); if (wantPlay) yt.playVideo(); }, onStateChange: (e) => setOn(e.data === 1 || e.data === 3), onError: () => setOn(false) } });
};
playBtn.addEventListener("click", () => {
  if (!ytReady) { wantPlay = true; setOn(true); if (!document.getElementById("yt-api")) { const t = document.createElement("script"); t.id = "yt-api"; t.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(t); } return; }
  const st = yt.getPlayerState(); if (st === 1 || st === 3) yt.pauseVideo(); else yt.playVideo();
});

// keep the beam under its key while the keys scroll (phones)
let st;
keysEl.addEventListener("scroll", () => {
  [beam, halo, me].forEach((el) => (el.style.transition = "none"));
  lightKey(litIndex, false);
  clearTimeout(st); st = setTimeout(() => [beam, halo, me].forEach((el) => (el.style.transition = "")), 120);
  if (!whisper.hidden) hideWhisper();
}, { passive: true });

// ---------- layout ----------
function layout() {
  placeBlacks();
  if (current) open(current, true); else lightKey(litIndex, false);
}
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
me.addEventListener("load", layout);
(document.fonts ? document.fonts.ready : Promise.resolve()).then(layout);
layout();
const h0 = location.hash.slice(1); if (S[h0]) setTimeout(() => open(h0, true), 50);
const GAL = {"awal-strategy": ["as3", "as22", "as31"], "awal-visual": ["av6", "av5", "av1"], "fg-q2": ["fg3", "fg1"], "fg-q4": ["fq2", "fq1"], "awal-site": ["ws19", "ws1"], "datalin": ["dt5", "dt1"], "ahli": ["al6", "al9", "al1"], "national-day": ["nd4", "nd3", "nd1"], "awal-shoot": ["sd1", "mb1"], "krt-akhdar": ["gc1"], "pearls": ["pr4", "pr1"]};
const lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg"), lbcount = document.getElementById("lbcount");
let gal = null, gi = 0;
function showGal() { lbimg.src = "../work/" + gal[gi] + ".jpg"; lbcount.textContent = (gi + 1) + " / " + gal.length; lbimg.alt = "Page " + (gi + 1); }
function openGal(id) { gal = GAL[id]; gi = 0; showGal(); lb.hidden = false; note(semiOfWhite(11) + 7, .2); }
function stepGal(d) { if (!gal) return; gi = (gi + d + gal.length) % gal.length; showGal(); note(semiOfWhite(11) + 7 + gi * 2, .15); }
function closeGal() { lb.hidden = true; gal = null; }
document.getElementById("lbprev").addEventListener("click", (e) => { e.stopPropagation(); stepGal(-1); });
document.getElementById("lbnext").addEventListener("click", (e) => { e.stopPropagation(); stepGal(1); });
document.getElementById("lbclose").addEventListener("click", closeGal);
lb.addEventListener("click", (e) => { if (e.target === lb) closeGal(); });
document.addEventListener("click", (e) => { const g = e.target.closest("[data-gallery]"); if (g && GAL[g.dataset.gallery]) openGal(g.dataset.gallery); });
document.addEventListener("keydown", (e) => { if (lb.hidden) return; if (e.key === "ArrowRight") stepGal(1); if (e.key === "ArrowLeft") stepGal(-1); if (e.key === "Escape") { e.stopImmediatePropagation(); closeGal(); } }, true);
